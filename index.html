<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fictional Games</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <nav>
      <button class="burger-btn">
        <span class="hamburger__line hamburger__line--top"></span>
        <span class="hamburger__line hamburger__line--mid"></span>
        <span class="hamburger__line hamburger__line--bottom"></span>
      </button>
      <div class="menu-left-center">
        <ul class="nav-left">
          <li class="home_li">
            <a href="index.html">
              <i class="fa-solid fa-gamepad"></i>
              <span class="logo_game">Fictional</span
              ><span class="logo_rush">Games</span>

              <span class="logo-short">
                <span class="logo-short-f">F</span>
                <span class="logo-short-g">G</span>
              </span></a
            >
          </li>
        </ul>
        <ul class="nav-center">
          <li><a href="trendy.html">Trendy</a></li>
          <li><a href="support.html">Support</a></li>
          <li>
            <a href="wishlist.html"
              >Wishlist <span class="wishlist-count">0</span></a
            >
          </li>
        </ul>
      </div>
      <ul class="nav-right">
        <li class="nav-right_basket">
          <a href="basket.html">
            <i class="fa-solid fa-basket-shopping"></i>
            <span class="basket-count">0</span></a
          >
        </li>
        <li class="nav-right_user">
          <a href="login.html"> <i class="fa-regular fa-user"></i></a>
        </li>
        <li class="nav-right_search" a href="#">
          <button class="search-btn">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </li>
      </ul>
      <div class="search-bar">
        <input class="search-bar_input" type="text" placeholder="Search..." />
        <button class="clear-input-btn">
          <i class="fa-solid fa-delete-left"></i>
        </button>
      </div>
    </nav>
    <div class="search-overlay"></div>
    <div class="search-results"></div>
    <section class="banner">
      <button class="carousel-btn carousel-btn-prev">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <img class="adgame-img" src="images/banner1.png" alt="ad game banner" />
      <button class="carousel-btn carousel-btn-next">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </section>
    <main>
      <div class="content-container">
        <section class="store">
          <h1>Hot Deals<i class="fa-solid fa-angle-right"></i></h1>
          <div class="games-grid" id="games-container"></div>
        </section>
      </div>
    </main>
    <footer>
      <section class="footer-section">
        <div class="footer-section-left">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div class="footer-section-right">
          <div class="section-right_up">Bezpieczne zakupy</div>
          <div class="section-right_bottom">Wsparcie 24/7</div>
        </div>
      </section>
      <section class="footer-section">
        <div class="footer-section-left">
          <i class="fa-regular fa-star"></i>
        </div>
        <div class="footer-section-right">
          <div class="section-right_up">Tysiące zadowolonych klientów</div>
          <div class="section-right_bottom">
            Dołącz do grona graczy, którzy nam zaufali
          </div>
        </div>
      </section>
      <section class="footer-section">
        <div class="footer-section-left"><i class="fa-solid fa-bolt"></i></div>
        <div class="footer-section-right">
          <div class="section-right_up">Natychmiastowa dostawa</div>
          <div class="section-right_bottom">
            Otrzymujesz produkt natychmiast po płatności
          </div>
        </div>
      </section>
      <section class="footer-section">
        <div class="footer-section-left"><i class="fa-solid fa-tag"></i></div>
        <div class="footer-section-right">
          <div class="section-right_up">Najlepsze ceny</div>
          <div class="section-right_bottom">Gry taniej niż u konkurencji</div>
        </div>
      </section>
